<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밥 줘! 프로토타입</title><style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');:root{--mint:#9ff4d2;--ink:#171a19;--muted:#777e7b;--line:#e8ece9}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;color:var(--ink);font-family:Pretendard,-apple-system,sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:white;box-shadow:0 10px 50px #17251d18}.top,.bottom{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid #f0f2f0}.logo{font-size:21px;font-weight:900}.logo span{color:#0CEFD3}.step,.bottom{font-size:10px;color:#89918c;font-weight:700}main{padding:25px 22px 34px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#32a980;margin-bottom:10px}h1{font-size:29px;line-height:1.25;letter-spacing:-1.4px;margin:0 0 9px;font-weight:900}.sub{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 24px}.card{border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px}.card-title{font-size:14px;font-weight:800;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #e3e9e5;border-radius:30px;padding:9px 13px;background:white;color:#4c5550;font-size:12px;font-weight:700}.chip.active{background:#caffeb;border-color:var(--mint);color:#17694d}input[type=range]{width:100%}#budget{accent-color:#0CEFD3}.budget{display:flex;justify-content:space-between;font-size:13px}.textinput{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}.primary{width:100%;border-radius:15px;background:var(--mint);padding:17px;font-size:17px;font-weight:900;margin-top:8px;box-shadow:0 5px 0 #64d7ae}.hero{background:var(--ink);color:white;border-radius:22px;padding:25px 22px;margin:5px 0 18px}.hero .mini{font-size:11px;color:var(--mint);font-weight:800}.hero h2{font-size:28px;margin:12px 0 8px}.hero p,.hint p{font-size:12px;color:#c3cbc6;margin:0}.status{display:flex;gap:10px;align-items:center;padding:15px;border-radius:15px;background:#f5f8f6;margin:16px 0}.pulse{width:10px;height:10px;border-radius:50%;background:#35b88c;box-shadow:0 0 0 5px #35b88c20}.status strong{font-size:13px}.status small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.progress{display:flex;gap:5px;margin:20px 0}.progress i{height:5px;flex:1;border-radius:10px;background:#e9eeea}.progress i.done{background:#53c99e}.hint{border-radius:18px;background:#f3fbf7;padding:20px;margin:16px 0;border:1px solid #dff4e9}.hint small{font-size:10px;color:#36a77e;font-weight:900;letter-spacing:.12em}.hint h2{font-size:23px;margin:9px 0 5px}.food{border-radius:18px;background:#fff8e9;padding:20px;text-align:center;margin:16px 0}.food .emoji{font-size:60px}.food h2{font-size:22px;margin:9px 0 4px}.food p{font-size:12px;color:#8a806d;margin:0}.feedback{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.vote{border:1px solid var(--line);border-radius:17px;background:white;padding:6px;overflow:hidden;cursor:pointer}.vote img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.vote.good.selected{background:#eafff5;border:2px solid #64d7ae}.vote.bad.selected{background:#fff0ed;border:2px solid #f0a69a}.note{text-align:center;color:var(--muted);font-size:11px;line-height:1.6}.toast{background:#19211d;color:white;padding:14px 16px;border-radius:13px;font-size:12px;margin-top:14px}@media(min-width:600px){body{padding:24px 0}.app{border-radius:25px;min-height:850px}}
</style></head><body><div class="app"><header class="top"><div class="logo">밥 <span>줘!</span></div><div class="step" id="step">YOUR AI FOOD AGENT</div></header><main id="screen"></main><footer class="bottom"><span>고민은 그만, 밥 줘!</span><span>AI FOOD ORDERING SERVICE</span></footer></div><script>
const s={page:0,budget:15000,likes:['혼밥'],dislikes:[],allergy:'',adventure:false,vote:''},root=document.querySelector('#screen');const chips=(a,sel)=>`<div class="chips">${a.map(x=>`<button class="chip ${sel.includes(x)?'active':''}" data-chip="${x}">${x}</button>`).join('')}</div>`;
function render(){document.querySelector('#step').textContent=['01 / 조건 설정','02 / AI 주문','03 / 배달 중','04 / 취향 학습'][s.page];if(s.page===0){root.innerHTML=`<div class="eyebrow" style="color:#2AC1BC">YOUR FOOD, OUR DECISION</div><h1>오늘 뭐 먹지?<br>이제 고민하지 마세요.</h1><p class="sub">예산과 취향만 알려주면 밥 줘!가 메뉴 선택부터 주문까지 대신할게요.</p><section class="card"><div class="card-title">오늘의 예산 <strong id="bl">${s.budget.toLocaleString()}원</strong></div><input id="budget" type="range" min="7000" max="50000" step="1000" value="${s.budget}"><div class="budget"><span>7천 원</span><span>5만 원</span></div></section><section class="card"><div class="card-title">오늘의 식사 상황</div>${chips(['혼밥','2인','여럿이서'],s.likes)}</section><section class="card"><div class="card-title">오늘의 기분</div>${chips(['든든하게','자극적으로','가볍게','달달하게','따뜻하게','시원하게'],s.dislikes)}</section><section class="card"><div class="card-title">알레르기 / 못 먹는 재료</div><input class="textinput" id="allergy" value="${s.allergy}" placeholder="없으면 비워두세요 (예: 땅콩, 우유)"></section><section class="card"><div class="card-title">오늘은 모험하기 <span style="color:#0CEFD3">NEW</span></div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:#6f7872">평소 안 먹던 메뉴도 도전해 볼까요?</span><button class="chip ${s.adventure?'active':''}" id="adventure">${s.adventure?'ON':'OFF'}</button></div></section><button class="primary" id="order" style="color:#fff;background-color:#2AC1BC;box-shadow:none;backdrop-filter:blur(4px)">주문하기</button>`;document.querySelector('#budget').oninput=e=>{s.budget=+e.target.value;document.querySelector('#bl').textContent=s.budget.toLocaleString()+'원'};document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{let arr=b.closest('.card').querySelector('.card-title').textContent.includes('식사 상황')?s.likes:s.dislikes,k=b.dataset.chip;arr.includes(k)?arr.splice(arr.indexOf(k),1):arr.push(k);render()});document.querySelector('#allergy').onchange=e=>s.allergy=e.target.value;document.querySelector('#adventure').onclick=()=>{s.adventure=!s.adventure;render()};document.querySelector('#order').onclick=()=>{s.allergy=document.querySelector('#allergy').value;s.page=1;render()}}
else if(s.page===1){root.innerHTML=`<div class="eyebrow">AI AGENT IS WORKING</div><h1>취향 분석 완료!<br>주문까지 맡겨주세요.</h1><p class="sub">조건에 맞는 메뉴를 고르고 주문을 진행하고 있어요.</p><div class="hero"><div class="mini">밥 줘! AI PICK</div><h2>오늘의 메뉴는<br>비밀이에요 🤫</h2><p>도착할 때까지 힌트를 모아보세요.</p></div><div class="status"><i class="pulse"></i><div><strong>주문이 완료됐어요!</strong><small>가게에서 음식을 준비하고 있어요.</small></div></div><div class="progress"><i class="done"></i><i class="done"></i><i></i><i></i></div><p class="note">메뉴를 미리 공개하지 않고, 배달 중 힌트로 알려드릴게요.</p><button class="primary" id="next">배달 현황 확인하기 →</button>`;document.querySelector('#next').onclick=()=>{s.page=2;render()}}
else if(s.page===2){root.innerHTML=`<div class="eyebrow">ON THE WAY TO YOU</div><h1>음식이 오고 있어요! 🚴</h1><p class="sub">기다리는 동안 밥 줘!가 준비한 힌트를 확인해 보세요.</p><div class="status"><i class="pulse"></i><div><strong>배달 중이에요</strong><small>음식이 곧 도착할 예정이에요.</small></div></div><div class="progress"><i class="done"></i><i class="done"></i><i class="done"></i><i></i></div><div class="hint"><small>오늘의 메뉴 힌트 01</small><h2>일식이에요! 🍣</h2><p>어떤 음식일지 한번 맞혀보세요!</p></div><div class="hint"><small>오늘의 메뉴 힌트 02</small><h2>두 가지 일식의 만남! 🍜</h2><p>익숙한 듯 새로운 조합일지도 몰라요.</p></div><button class="primary" id="arrive">음식 도착! 봉투 열기</button>`;document.querySelector('#arrive').onclick=()=>{s.page=3;render()}}
else{root.innerHTML=`<div class="eyebrow">TASTE & FEEDBACK</div><h1>오늘의 메뉴,<br>마음에 들었나요?</h1><p class="sub">한입 먹어보고 솔직한 취향을 알려주세요. 다음 메뉴 선택에 반영할게요.</p><div class="food"><div class="emoji">🍛🍜</div><h2>오늘의 메뉴는 카레우동!</h2><p>AI가 고른 오늘의 한 끼</p></div><div class="feedback"><button class="vote good ${s.vote==='good'?'selected':''}" id="good" aria-label="냠! 맛있어요"><img src="KakaoTalk_20261022_121620403.png" alt=""></button><button class="vote bad ${s.vote==='bad'?'selected':''}" id="bad" aria-label="퉤... 별로예요"><img src="KakaoTalk_20261022_121620403_01.png" alt=""></button></div>${s.vote?`<div class="toast">${s.vote==='good'?'취향 저격 성공!':'피드백 접수 완료!'} 다음 메뉴를 고를 때 반영할게요 💚</div>`:'<p class="note">선택한 피드백은 다음 메뉴 추천과 주문에 반영돼요.</p>'}<button class="primary" id="again">${s.vote?'처음으로 돌아가기':'피드백 보내기'}</button>`;document.querySelector('#good').onclick=()=>{s.vote='good';render()};document.querySelector('#bad').onclick=()=>{s.vote='bad';render()};document.querySelector('#again').onclick=()=>{s.page=0;s.vote='';render()}}}render();
</script></body></html>
